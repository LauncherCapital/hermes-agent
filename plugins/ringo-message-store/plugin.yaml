name: ringo-message-store
version: "0.2.0"
kind: service
description: "Stores authenticated project messages behind local tools."
author: "LauncherCapital"
hooks:
  - ingress_event
  - project_claimed
  - health_report
  - message_store_query
actions:
  - ringo.file_index.apply
  - ringo.file_index.reconcile
  - ringo.file_index.search
  - ringo.file_graph.batch
  - ringo.file_graph.ack
